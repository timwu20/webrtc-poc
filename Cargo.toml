[workspace]
members = [
    "server",
    "client"
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.86"
futures = "0.3.30"
rand = "0.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

axum = "0.7.5"
libp2p = { git = "https://github.com/libp2p/rust-libp2p.git", tag="v0.56.0", features = ["ed25519", "macros", "ping", "tokio"] }
libp2p-webrtc = { git = "https://github.com/libp2p/rust-libp2p.git", tag="v0.56.0", features = ["tokio"] }
libp2p-perf = { git = "https://github.com/libp2p/rust-libp2p.git", tag="v0.56.0" }
tokio = { version = "1.38", default-features = false }
tokio-util = { version = "0.7", features = ["compat"] }